services:
  scriberrtg:
    build: .
    container_name: scriberrtg
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SCRIBERR_API_TOKEN: ${SCRIBERR_API_TOKEN}
      SCRIBERR_HOST_URL: ${SCRIBERR_HOST_URL}
      # Optional:
      # POLL_INTERVAL_MS: 2500
      # POLL_TIMEOUT_MS: 600000
    networks:
      - scriberr_default

networks:
  scriberr_default:
    external: true

