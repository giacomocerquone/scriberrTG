services:
  scriberrtg:
    build: .
    container_name: scriberrtg
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SCRIBERR_API_TOKEN: ${SCRIBERR_API_TOKEN}
      SCRIBERR_HOST_URL: ${SCRIBERR_HOST_URL}
      # Optional:
      # SSE_TIMEOUT_MS: 600000
      # PROFILE_CACHE_TTL_MS: 600000
    networks:
      - scriberr_default

networks:
  scriberr_default:
    external: true
    name: scriberr_default
