# Run from repo root:
#   docker compose -f docker/docker-compose.scriberr.yml up -d

name: scriberr-stack

services:
  scriberr:
    image: ghcr.io/rishikanthc/scriberr:latest
    container_name: scriberr
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - scriberr_data:/app/data
      - scriberr_env:/app/whisperx-env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      APP_ENV: production
    networks:
      - scriberr_stack

  scriberrtg:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: scriberrtg
    restart: unless-stopped
    depends_on:
      - scriberr
    environment:
      TELEGRAM_BOT_TOKEN: xxx
      SCRIBERR_API_TOKEN: xxx
      SCRIBERR_HOST_URL: http://scriberr:8080
    networks:
      - scriberr_stack

volumes:
  scriberr_data: {}
  scriberr_env: {}

networks:
  scriberr_stack:
    driver: bridge
